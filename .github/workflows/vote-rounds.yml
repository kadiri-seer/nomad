name: Vote rounds
# Opens and closes $NOMAD holder vote rounds. Runs every 5 minutes (the shortest GitHub allows); press "Run workflow"
# with "open" to start the first round (or one early), or "close" to close a finished one.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "auto, open or close"
        required: true
        default: auto
        type: choice
        options: [auto, open, close]
permissions:
  contents: write
  issues: write
concurrency:
  group: vote-rounds
  cancel-in-progress: false
jobs:
  rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the round job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ inputs.action || 'auto' }}
        run: |
          git config user.name "kadiri-seer"
          git config user.email "kadiriseer@gmail.com"
          pnpm exec tsx apps/web/scripts/governance/run.ts "$ACTION"
