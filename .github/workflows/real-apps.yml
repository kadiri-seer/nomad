name: Real apps
# Moves a sample agent with the built CLI, then asks the real Codex CLI, Gemini CLI and OpenClaw
# to read what Nomad wrote. Kept apart from CI so a new release of one of those apps cannot block
# a normal push. It runs weekly, after changes to the adapters, and by hand.
on:
  workflow_dispatch:
    inputs:
      codex:
        description: Codex CLI version (npm tag or version)
        default: latest
      gemini:
        description: Gemini CLI version (npm tag or version)
        default: latest
      openclaw:
        description: OpenClaw version (npm tag or version)
        default: latest
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "packages/adapters/**"
      - "packages/migration/**"
      - "scripts/check-real-apps.mjs"
      - "scripts/check-hey-servers.mjs"
      - "scripts/check-rushr.mjs"
      - "scripts/check-qhooks.mjs"
      - "scripts/check-tokyo.mjs"
      - "scripts/check-ostra.mjs"
      - "scripts/check-stoa.mjs"
      - "scripts/check-zolva.mjs"
      - "scripts/check-memoria.mjs"
      - "scripts/check-upoch.mjs"
      - "scripts/check-oddsengine.mjs"
      - "scripts/check-your-nomad.mjs"
      - "packages/mcp/**"
      - ".github/workflows/real-apps.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      # The apps go in their own folder, away from the repository and its dependencies.
      - name: Install the real apps
        env:
          CODEX: ${{ inputs.codex || 'latest' }}
          GEMINI: ${{ inputs.gemini || 'latest' }}
          OPENCLAW: ${{ inputs.openclaw || 'latest' }}
        run: |
          for v in "$CODEX" "$GEMINI" "$OPENCLAW"; do
            [[ "$v" =~ ^[0-9A-Za-z.+-]{1,40}$ ]] || { echo "Not a version: $v"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/apps" && cd "$RUNNER_TEMP/apps"
          npm init -y > /dev/null
          npm install --no-fund --no-audit "@openai/codex@$CODEX" "@google/gemini-cli@$GEMINI" "openclaw@$OPENCLAW"
      - name: Check the apps read what Nomad wrote
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-real-apps.mjs
      # Read-only, keyless: HEY Research Lab's hosted and local servers answer as Nomad's profile expects.
      - name: Check HEY Research Lab's servers
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/check-hey-servers.mjs"
      # Rushr's Codex plugin through the real Codex and Gemini CLI, and Rushr's server in dry run with no wallet.
      - name: Check Rushr
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-rushr.mjs
      # Keyless: QHooks' hosted server answers through the address Nomad writes. Nothing is signed or sent.
      - name: Check QHooks
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/check-qhooks.mjs"
      # Keyless: Tokyo Futuro's hosted server and npm package list their tools, and an agent folder moves into OpenClaw.
      - name: Check Tokyo Futuro
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-tokyo.mjs
      # Ostra's package in a throwaway vault folder with its services off, its connector, and a move to the real Codex and OpenClaw.
      - name: Check Ostra
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-ostra.mjs
      # Keyless and read-only: Stoa's hosted server lists its tools and router, and a setup moves to the real Codex and OpenClaw.
      - name: Check Stoa
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-stoa.mjs
      # Keyless and read-only: Zolva's hosted server lists its tools and refuses a wrong key, and a setup with a
      # (fake) key moves to the real Codex (bearer_token_env_var = ZOLVA_KEY) and OpenClaw, with the key nowhere.
      - name: Check Zolva
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-zolva.mjs
      # One request with no key: Memoria's hosted server refuses it (401), and a setup with a (fake) key moves to the
      # real Codex (bearer_token_env_var = MEMORIA_API_KEY) and OpenClaw, with the key nowhere.
      - name: Check Memoria
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-memoria.mjs
      # Nothing from Upoch is installed or run: npm still names the upoch command, and a setup with a planted
      # (fake) ~/.upoch moves to the real Codex and OpenClaw, with nothing from that folder in what Nomad wrote.
      - name: Check Upoch
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-upoch.mjs
      # OddsEngine's server refuses a tool call with no key, and a setup with a (fake) key in its address moves to the
      # real Codex (plain address, bearer_token_env_var = ODDSENGINE_API_KEY) and OpenClaw, with the key nowhere.
      - name: Check OddsEngine
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-oddsengine.mjs
      # Your Nomad: nomad connect adds the server to the real Codex, Gemini CLI and OpenClaw, the server answers
      # when started exactly as Codex starts it, and nomad connect --remove takes it out again.
      - name: Check Your Nomad
        run: NOMAD_APPS_BIN="$RUNNER_TEMP/apps/node_modules/.bin" node scripts/check-your-nomad.mjs
