name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:cli
      - run: pnpm build:ui
      - run: pnpm build:web
        if: matrix.os == 'ubuntu-latest'
      # Install the packed CLI like a user would, outside the repository, and run it.
      - name: Packed install smoke test
        shell: bash
        run: |
          node scripts/prepare-npm.mjs
          cd release/npm && npm pack
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/release/npm/thenomad-"*.tgz
          npx thenomad --version
          npx thenomad adapters --json > /dev/null
          npx thenomad scan --json
