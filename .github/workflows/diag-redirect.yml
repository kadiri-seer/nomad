name: Diag redirect
on:
  push:
    branches: [diag-redirect]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in https://thenomad.website/install.ps1 https://www.thenomad.website/install.ps1 https://thenomad.website/install.sh http://thenomad.website/install.ps1; do
            echo "== $u"; curl -sS -o /dev/null -D - "$u" | grep -iE "^HTTP|^location|^server|^x-vercel|^content-type"
          done
          echo "== github api"; curl -sS -o /dev/null -D - https://api.github.com/repos/kadiri-seer/nomad/releases/latest | grep -iE "^HTTP|x-ratelimit-(limit|remaining)"
          echo "== github latest redirect"; curl -sS -o /dev/null -D - https://github.com/kadiri-seer/nomad/releases/latest | grep -iE "^HTTP|^location"
  windows:
    runs-on: windows-2025
    steps:
      - shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          foreach ($u in @('https://thenomad.website/install.ps1','https://www.thenomad.website/install.ps1')) {
            Write-Host "== $u"
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -MaximumRedirection 0 -ErrorAction Stop; Write-Host "status $($r.StatusCode)" }
            catch { $resp = $_.Exception.Response; if ($resp) { Write-Host "status $([int]$resp.StatusCode) location $($resp.Headers['Location'])" } else { Write-Host "error $($_.Exception.Message)" } }
          }
